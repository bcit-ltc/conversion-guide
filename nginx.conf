server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Include MIME types
    include /etc/nginx/mime.types;
    
    # Serve clean URLs without .html extension
    location / {
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /css/ {
        expires 1w;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        expires 1w;
        add_header Cache-Control "public, immutable";
    }
}
